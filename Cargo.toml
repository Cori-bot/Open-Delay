[workspace]
members = ["crates/core", "crates/rtmp", "crates/service", "desktop"]
default-members = ["crates/core", "crates/rtmp", "crates/service"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.93"
license-file = "LICENSE"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

