<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:*; object-src 'none'"><title>Open-Delay</title><link rel="stylesheet" href="settings.css"></head>
<body><main><h1>Open-Delay</h1><p>Local control. No account.</p><label>Delay / Délai <span>seconds</span><input id="delay" type="number" min="0" max="600" step="1" value="15"></label><label>Route ID <span>optional</span><input id="route" maxlength="64" placeholder="All connected group routes"></label><p class="note">0 seconds returns live. A route ID targets one output. Leave it blank to control connected group outputs.</p><p class="note">The engine address is discovered automatically from Open-Delay. Start the application first.</p><p id="message" role="status"></p></main><script src="settings.js"></script></body></html>
