[package]
name = "open-delay-rtmp"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Independent bounded RTMP chunk and AMF0 transport for Open-Delay"

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
