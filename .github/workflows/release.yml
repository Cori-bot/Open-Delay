name: Windows signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            integrations/streamdeck/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Verify tag, version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a stable version tag' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release must reference an existing tag' }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) { throw 'Checked-out source does not match the release tag' }
          $version = python scripts/release_metadata.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release versions do not match' }
          "VERSION=$version" >> $env:GITHUB_ENV
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY repository secret is required' }
          $config = Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.bundle.createUpdaterArtifacts -or [string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey)) { throw 'Updater artifacts and public key must be configured' }
          $expected = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          if ($config.plugins.updater.endpoints.Count -ne 1 -or $config.plugins.updater.endpoints[0] -ne $expected) { throw 'Updater endpoint must match this release repository' }
      - run: npm --prefix ui ci
      - run: npm --prefix integrations/streamdeck ci
      - run: python -m unittest discover -s scripts -p "test_release_metadata.py"
      - run: npm --prefix ui run lint
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
      - run: cargo build --locked -p open-delay-service
      - name: Verify desktop update UI in an isolated browser
        run: npm --prefix ui run test:updates
      - name: Verify real engine to browser-source delivery
        run: npm --prefix ui run test:overlay:live
      - name: Verify all application pages, languages and widths
        run: npm --prefix ui run test:app
      - run: npm --prefix ui audit --omit=dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: npm --prefix integrations/streamdeck test
      - run: npm --prefix integrations/streamdeck run validate
      - run: npm --prefix integrations/streamdeck run pack
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Build signed Windows installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis -- --locked
      - name: Package current release and signed updater manifest
        run: python scripts/package_release.py --repository $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG
      - name: Retain release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Open-Delay-windows-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/Open-Delay_${{ env.VERSION }}_x64-setup.exe
            dist/Open-Delay_${{ env.VERSION }}_x64-setup.exe.sig
            dist/Open-Delay_${{ env.VERSION }}.streamDeckPlugin
            dist/Open-Delay_${{ env.VERSION }}-source.zip
            dist/latest.json
            dist/release.json
            dist/SHA256SUMS.txt
      - name: Stage draft release, upload everything, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already published release' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Open-Delay $env:VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage draft release' }
          }
          $manifest = Get-Content dist/release.json -Raw | ConvertFrom-Json
          $assets = @($manifest.files | ForEach-Object { Join-Path dist $_.name }) + @('dist/release.json', 'dist/SHA256SUMS.txt')
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload all release assets; release remains a draft' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish complete release' }
